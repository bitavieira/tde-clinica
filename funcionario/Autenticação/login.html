<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Area do funcionario</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/login.css">
</head>
<body>
    <header class="cabeçalho">
        <h1>Clinica Vida</h1>
        <p>Cuidado humanizado e saúde para toda a família</p>
        <nav id="nav-bar-login">
            <ul>
                <li><a href="../../index.html">Voltar</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="login-container">
        <h1>Login</h1>
        <form id="form-login"action="" method="POST">
            <label for="username">Usuário:</label>
            <input type="text" id="username" name="username" required><br><br>

            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{6,}"><br><br>

            <input type="submit" value="Entrar">
        </form>
        <p id="error-message" style="color: red;"></p>
        <p><a href="esqueci-senha.html">Esqueci minha senha</a></p>
        </section>
    </main>
</body>
</html>
